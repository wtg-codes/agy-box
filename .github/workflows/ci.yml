---
name: CI/CD

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
    # Docs-only pushes (e.g. diagram renders) do not rebuild the image. PRs are
    # never path-filtered: their checks are required by the main ruleset.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

# Only PR runs are cancelled by newer pushes. Runs on main/tags are never
# cancelled mid-publish (between push-by-digest and tagging).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more override this.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # docker/build-push-action v6+ exports a build record and writes a job
  # summary by default; keep the pre-upgrade behaviour (no extra artifacts).
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Self-hosted runners never execute code from fork PRs (public repo): those
  # jobs fall back to GitHub-hosted runners.
  lint:
    name: Lint Codebase
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64","dgx-spark"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A skip directive in any PR commit message ends up in the squash-merge
      # commit on main and silently suppresses the push-triggered CI/CD run.
      - name: Reject CI skip directives in PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks: *true'
          if git log --format='%h %B' "${BASE_SHA}..${HEAD_SHA}" | grep -inE "$pattern"; then
            echo "::error::A commit message in this PR contains a CI skip directive. Reword it, otherwise the merge to main will not run CI/CD."
            exit 1
          fi

      - name: Ensure linters are installed
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v yamllint >/dev/null 2>&1; then
            python3 -m venv "$HOME/.local/yamllint-venv"
            "$HOME/.local/yamllint-venv/bin/pip" install --quiet yamllint
            ln -sf "$HOME/.local/yamllint-venv/bin/yamllint" "$HOME/.local/bin/yamllint"
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            sc_arch=$(uname -m)
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.${sc_arch}.tar.xz" | tar -xJ -C /tmp
            mv /tmp/shellcheck-v0.10.0/shellcheck "$HOME/.local/bin/shellcheck"
            chmod +x "$HOME/.local/bin/shellcheck"
          fi
          if ! command -v actionlint >/dev/null 2>&1; then
            al_arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
            curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_${al_arch}.tar.gz" | tar -xz -C "$HOME/.local/bin" actionlint
          fi

      - name: Lint YAML
        run: yamllint -s -c .yamllint.yml .

      - name: Lint GitHub Actions workflows
        run: actionlint -color

      - name: Run ShellCheck
        run: |
          find . -type f \( -name "*.sh" -o -name "agy-box-manager" \) -print0 | xargs -0 shellcheck
          # Executable scripts without a .sh extension
          shellcheck rootfs/usr/local/bin/agy-doctor \
            rootfs/usr/local/bin/agy-vdi \
            rootfs/etc/X11/icewm/startup

      - name: Lint Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile

  test-scripts:
    name: Run Script Tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64","dgx-spark"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Bats
        run: npm install bats

      - name: Run Bats Tests
        run: ./node_modules/.bin/bats tests/

  # Multi-arch build matrix, native on both architectures (no QEMU):
  # linux/amd64 on GitHub-hosted ubuntu-24.04, linux/arm64 on the DGX Spark
  # self-hosted runners (persistent dgx-spark-builder cache). Fork PRs build
  # arm64 on GitHub-hosted ubuntu-24.04-arm instead. The base image (quay.io/toolbx/ubuntu-toolbox:24.04) ships native multi-arch manifests.
  #
  # Each architecture: builds once, tests it, scans SBOM via Syft/Grype,
  # and (on main/tags) pushes by digest. The Publish & Release job joins the digests
  # into a multi-arch manifest index via `docker buildx imagetools create`.
  build:
    name: Build & Validate Image (${{ matrix.arch }})
    runs-on: ${{ (github.event.pull_request.head.repo.fork && matrix.fork_runner) || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds on both architectures (no QEMU): amd64 on a
          # GitHub-hosted runner (free for public repos), arm64 on the DGX
          # Spark self-hosted runners with their persistent BuildKit cache.
          - arch: amd64
            runner: ubuntu-24.04
            fork_runner: ubuntu-24.04
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, dgx-spark]
            fork_runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      # Persistent BuildKit builder on the Spark runners; ephemeral elsewhere.
      BUILDER: ${{ (matrix.arch == 'arm64' && !github.event.pull_request.head.repo.fork) && 'dgx-spark-builder' || 'gha' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx (GitHub-hosted)
        if: env.BUILDER == 'gha'
        uses: docker/setup-buildx-action@v4
        with:
          name: gha

      - name: Set up persistent Docker Buildx builder (DGX Spark)
        if: env.BUILDER == 'dgx-spark-builder'
        run: |
          for b in $(docker buildx ls | awk '$1 ~ /^builder-[0-9a-f-]+$/ {print $1}'); do
            docker buildx rm -f "$b" || true
          done
          if ! docker buildx inspect dgx-spark-builder >/dev/null 2>&1; then
            docker buildx create --name dgx-spark-builder --driver docker-container --use --bootstrap
          else
            docker buildx use dgx-spark-builder
            docker buildx inspect --bootstrap dgx-spark-builder >/dev/null
          fi

      # OCI labels (source, revision, created, version, ...). Computed once and
      # applied to both the tested (loaded) build and the pushed build so their
      # configs match; labels only touch the image config, so layers stay cached.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Keep the Containerfile's description instead of the repo description.
          labels: |
            org.opencontainers.image.description=Declarative Student Workspace for wtgOS Cloud-Native Laboratory

      - name: Build and load image into Docker
        uses: docker/build-push-action@v7
        with:
          builder: ${{ env.BUILDER }}
          context: .
          file: ./Containerfile
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: localhost/agy-box:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ env.BUILDER == 'gha' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      # Cataloging the multi-GB image (~3 min) and downloading the Grype DB are
      # independent of the integration tests, so run them in the background
      # while the tests execute. The SBOM is generated once; Grype then scans
      # the SBOM instead of re-cataloging the image.
      - name: Start SBOM generation and Grype DB update (background)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          mkdir -p "${RUNNER_TEMP}/scan"
          # Single quotes are intentional: expanded by the inner bash.
          # shellcheck disable=SC2016
          nohup bash -c '"$SYFT" scan docker:localhost/agy-box:test -o spdx-json=sbom.spdx.json \
            > "$RUNNER_TEMP/scan/syft.log" 2>&1; echo $? > "$RUNNER_TEMP/scan/syft.rc"' > /dev/null 2>&1 &
          # shellcheck disable=SC2016
          nohup bash -c '"$GRYPE" db update \
            > "$RUNNER_TEMP/scan/grype-db.log" 2>&1; echo $? > "$RUNNER_TEMP/scan/grype-db.rc"' > /dev/null 2>&1 &

      - name: Install Distrobox
        run: |
          if ! command -v distrobox >/dev/null 2>&1; then
            curl -s https://raw.githubusercontent.com/89luca89/distrobox/main/install | sudo -n sh || \
            curl -s https://raw.githubusercontent.com/89luca89/distrobox/main/install | sh -s -- --prefix "$HOME/.local"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Distrobox Integration Tests
        env:
          SKIP_BUILD: "true"
          RUNTIME: "docker"
          IMAGE_NAME: "localhost/agy-box:test"
        run: |
          ./scripts/test-box.sh

      - name: Wait for SBOM
        run: |
          # shellcheck disable=SC2016 # single quotes are intentional (expanded by the inner bash)
          timeout 1200 bash -c 'until [ -f "$RUNNER_TEMP/scan/syft.rc" ]; do sleep 2; done'
          cat "${RUNNER_TEMP}/scan/syft.log"
          rc=$(cat "${RUNNER_TEMP}/scan/syft.rc")
          if [ "$rc" != "0" ]; then
            echo "::error::Syft SBOM generation failed (exit $rc)"
            exit "$rc"
          fi
          if ! jq -e '.spdxVersion' sbom.spdx.json > /dev/null; then
            echo "::error::sbom.spdx.json is not a valid SPDX JSON document"
            exit 1
          fi
          ls -lh sbom.spdx.json

      # Informational scan: findings do not fail the build (no --fail-on),
      # equivalent to the former anchore/scan-action config fail-build=false,
      # only-fixed=true. Real Grype errors (e.g. no usable DB) still fail.
      - name: Run Grype vulnerability scan
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          # shellcheck disable=SC2016 # single quotes are intentional (expanded by the inner bash)
          if ! timeout 600 bash -c 'until [ -f "$RUNNER_TEMP/scan/grype-db.rc" ]; do sleep 2; done'; then
            echo "::warning::Background Grype DB update did not finish within 10 min"
          fi
          cat "${RUNNER_TEMP}/scan/grype-db.log" || true
          db_rc=$(cat "${RUNNER_TEMP}/scan/grype-db.rc" 2> /dev/null || echo "missing")
          if [ "$db_rc" != "0" ]; then
            echo "::warning::Background Grype DB update failed (exit ${db_rc}); grype will retry the download itself"
          fi
          "$GRYPE" sbom:sbom.spdx.json --only-fixed -o table

      - name: Prepare and upload SBOM Artifact
        run: cp sbom.spdx.json "sbom-${{ matrix.arch }}.spdx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 5

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          builder: ${{ env.BUILDER }}
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Only tag/publish once every check has passed. Until this job runs, the
  # pushed image exists only as an untagged digest.
  publish-and-release:
    name: Publish & Release
    needs: [build, lint, test-scripts]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, dgx-spark]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/sboms
          pattern: sbom-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Joins the per-arch digests (amd64 + arm64) into one multi-arch image
      # index and applies the tags.
      - name: Tag and push image manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$TAG"
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          # v4 defaults this to true (needs extra permissions); keep v2 behaviour.
          create-storage-record: false

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/sboms/*.spdx.json
