---
name: CI/CD

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more override this.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # docker/build-push-action v6+ exports a build record and writes a job
  # summary by default; keep the pre-upgrade behaviour (no extra artifacts).
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml
          strict: true

      - name: Run ShellCheck
        run: |
          find . -type f \( -name "*.sh" -o -name "agy-box-manager" \) -print0 | xargs -0 shellcheck
          # Executable scripts without a .sh extension
          shellcheck rootfs/usr/local/bin/agy-setup-helper \
            rootfs/usr/local/bin/agy-vdi \
            rootfs/usr/local/bin/agy-install-ide \
            rootfs/etc/X11/icewm/startup

      - name: Lint Containerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile

  test-scripts:
    name: Run Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bats
        run: npm install bats

      - name: Run Bats Tests
        run: ./node_modules/.bin/bats tests/

  # Multi-arch build matrix: both linux/amd64 and linux/arm64 are built on native
  # runners (ubuntu-24.04 and ubuntu-24.04-arm) in parallel without slow QEMU emulation.
  # The base image (quay.io/toolbx/ubuntu-toolbox:24.04) ships native multi-arch manifests.
  #
  # Each architecture: builds once, tests it via Distrobox, scans SBOM via Syft/Grype,
  # and (on main/tags) pushes by digest. The Publish & Release job joins the digests
  # into a multi-arch manifest index via `docker buildx imagetools create`.
  build:
    name: Build & Validate Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Runners are ephemeral; skip the ~30s builder teardown at job end.
          cleanup: false

      # OCI labels (source, revision, created, version, ...). Computed once and
      # applied to both the tested (loaded) build and the pushed build so their
      # configs match; labels only touch the image config, so layers stay cached.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Keep the Containerfile's description instead of the repo description.
          labels: |
            org.opencontainers.image.description=Declarative Student Workspace for wtgOS Cloud-Native Laboratory

      - name: Build and load image into Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: localhost/agy-box:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      # Cataloging the multi-GB image (~3 min) and downloading the Grype DB are
      # independent of the integration tests, so run them in the background
      # while the tests execute. The SBOM is generated once; Grype then scans
      # the SBOM instead of re-cataloging the image.
      - name: Start SBOM generation and Grype DB update (background)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          mkdir -p "${RUNNER_TEMP}/scan"
          nohup bash -c '"$SYFT" scan docker:localhost/agy-box:test -o spdx-json=sbom.spdx.json \
            > "$RUNNER_TEMP/scan/syft.log" 2>&1; echo $? > "$RUNNER_TEMP/scan/syft.rc"' > /dev/null 2>&1 &
          nohup bash -c '"$GRYPE" db update \
            > "$RUNNER_TEMP/scan/grype-db.log" 2>&1; echo $? > "$RUNNER_TEMP/scan/grype-db.rc"' > /dev/null 2>&1 &

      - name: Install Distrobox
        run: |
          curl -s https://raw.githubusercontent.com/89luca89/distrobox/main/install | sudo sh

      - name: Run Distrobox Integration Tests
        env:
          SKIP_BUILD: "true"
          RUNTIME: "docker"
          IMAGE_NAME: "localhost/agy-box:test"
        run: |
          ./scripts/test-box.sh

      - name: Wait for SBOM
        run: |
          timeout 1200 bash -c 'until [ -f "$RUNNER_TEMP/scan/syft.rc" ]; do sleep 2; done'
          cat "${RUNNER_TEMP}/scan/syft.log"
          rc=$(cat "${RUNNER_TEMP}/scan/syft.rc")
          if [ "$rc" != "0" ]; then
            echo "::error::Syft SBOM generation failed (exit $rc)"
            exit "$rc"
          fi
          if ! jq -e '.spdxVersion' sbom.spdx.json > /dev/null; then
            echo "::error::sbom.spdx.json is not a valid SPDX JSON document"
            exit 1
          fi
          ls -lh sbom.spdx.json

      # Informational scan: findings do not fail the build (no --fail-on),
      # equivalent to the former anchore/scan-action config fail-build=false,
      # only-fixed=true. Real Grype errors (e.g. no usable DB) still fail.
      - name: Run Grype vulnerability scan
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          if ! timeout 600 bash -c 'until [ -f "$RUNNER_TEMP/scan/grype-db.rc" ]; do sleep 2; done'; then
            echo "::warning::Background Grype DB update did not finish within 10 min"
          fi
          cat "${RUNNER_TEMP}/scan/grype-db.log" || true
          db_rc=$(cat "${RUNNER_TEMP}/scan/grype-db.rc" 2> /dev/null || echo "missing")
          if [ "$db_rc" != "0" ]; then
            echo "::warning::Background Grype DB update failed (exit ${db_rc}); grype will retry the download itself"
          fi
          "$GRYPE" sbom:sbom.spdx.json --only-fixed -o table

      - name: Prepare and upload SBOM Artifact
        run: cp sbom.spdx.json "sbom-${{ matrix.arch }}.spdx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 5

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Only tag/publish once every check has passed. Until this job runs, the
  # pushed image exists only as an untagged digest.
  publish-and-release:
    name: Publish & Release
    needs: [build, lint, test-scripts]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/sboms
          pattern: sbom-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Tags the pushed digest(s). With a single (amd64) source this copies the
      # image index produced by the build as-is; the loop over digest files keeps
      # it ready for additional architectures later.
      - name: Tag and push image manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$TAG"
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          # v4 defaults this to true (needs extra permissions); keep v2 behaviour.
          create-storage-record: false

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/sboms/*.spdx.json
