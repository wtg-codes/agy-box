name: Compile Mermaid Diagrams

on:
  push:
    paths:
      - 'docs/diagrams/*.mmd'
      - 'docs/diagrams/config.json'
      - 'docs/diagrams/style.css'
      - '.github/workflows/compile-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli

      - name: Create rendered output directory
        run: mkdir -p docs/diagrams/rendered

      - name: Compile Diagrams
        run: |
          for file in docs/diagrams/*.mmd; do
            if [ -f "$file" ]; then
              basename=$(basename "$file" .mmd)
              echo "Compiling $file to SVG & PNG..."
              mmdc -i "$file" -o "docs/diagrams/rendered/${basename}.svg" -c docs/diagrams/config.json -C docs/diagrams/style.css -b transparent
              mmdc -i "$file" -o "docs/diagrams/rendered/${basename}.png" -c docs/diagrams/config.json -C docs/diagrams/style.css -b transparent
            fi
          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-compile Mermaid diagrams to SVG/PNG [skip ci]"
          file_pattern: "docs/diagrams/rendered/*"
