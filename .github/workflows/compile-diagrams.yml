name: Compile Diagrams

on:
  push:
    paths:
      - 'docs/diagrams/*.mmd'
      - 'docs/diagrams/sources/**'
      - 'docs/diagrams/config.json'
      - 'docs/diagrams/style.css'
      - 'docs/diagrams/puppeteer-config.json'
      - '.github/workflows/compile-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node v5+ auto-enables caching; there is no package.json here.
          package-manager-cache: false

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli

      - name: Create rendered output directory
        run: mkdir -p docs/diagrams/rendered docs/diagrams/interactive

      - name: Compile Diagrams
        run: |
          for file in docs/diagrams/*.mmd; do
            if [ -f "$file" ]; then
              basename=$(basename "$file" .mmd)
              echo "Compiling $file to SVG & PNG..."
              mmdc -i "$file" -o "docs/diagrams/rendered/${basename}.svg" -c docs/diagrams/config.json -C docs/diagrams/style.css -p docs/diagrams/puppeteer-config.json -b transparent
              mmdc -i "$file" -o "docs/diagrams/rendered/${basename}.png" -c docs/diagrams/config.json -C docs/diagrams/style.css -p docs/diagrams/puppeteer-config.json -b transparent
            fi
          done

      - name: Render Archify Diagrams
        run: |
          if [ ! -d /tmp/archify ]; then
            git clone --depth 1 https://github.com/tt-a1i/archify /tmp/archify
          fi
          node /tmp/archify/archify/bin/archify.mjs render architecture docs/diagrams/sources/system-topology.architecture.json docs/diagrams/interactive/system-topology.html
          node /tmp/archify/archify/bin/archify.mjs render architecture docs/diagrams/sources/product-communication.architecture.json docs/diagrams/interactive/product-communication.html
          node /tmp/archify/archify/bin/archify.mjs render workflow docs/diagrams/sources/setup-assistant.workflow.json docs/diagrams/interactive/setup-assistant.html

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-compile diagrams to SVG/PNG/HTML [skip ci]"
          file_pattern: "docs/diagrams/rendered/* docs/diagrams/interactive/*"
