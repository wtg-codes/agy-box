name: Compile Diagrams

# Renders only on main, so bot commits never land on PR branches.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/diagrams/*.mmd'
      - 'docs/diagrams/config.json'
      - 'docs/diagrams/style.css'
      - 'docs/diagrams/puppeteer-config.json'
      - '.github/workflows/compile-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: [self-hosted, Linux, ARM64, dgx-spark]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node v5+ auto-enables caching; there is no package.json here.
          package-manager-cache: false

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli@11

      - name: Create rendered output directory
        run: mkdir -p docs/diagrams/rendered

      - name: Compile Diagrams
        run: |
          for file in docs/diagrams/*.mmd; do
            if [ -f "$file" ]; then
              basename=$(basename "$file" .mmd)
              echo "Compiling $file to SVG & PNG..."
              mmdc -i "$file" -o "docs/diagrams/rendered/${basename}.svg" -c docs/diagrams/config.json -C docs/diagrams/style.css -p docs/diagrams/puppeteer-config.json -b transparent
              mmdc -i "$file" -o "docs/diagrams/rendered/${basename}.png" -c docs/diagrams/config.json -C docs/diagrams/style.css -p docs/diagrams/puppeteer-config.json -b transparent
            fi
          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # GITHUB_TOKEN commits never trigger other workflows, so no skip directive
          # is needed (and it would leak into squash-merge messages).
          commit_message: "chore: auto-compile diagrams to SVG/PNG"
          file_pattern: "docs/diagrams/rendered/*"
